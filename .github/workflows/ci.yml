name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Release gates (offline, no network or API key)
        run: python -m evals.run_evals --json eval-report.json
      - name: Backlog is regenerated from source
        run: |
          python -m backlog.score
          git diff --exit-code docs/BACKLOG.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
